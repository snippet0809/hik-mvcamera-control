# PR / main：Windows 上构建 DLL、wheel，并做 Go 校验
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-wheel-and-go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake 4.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.2"

      - name: Install Ninja
        run: choco install ninja --yes

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & build native DLL
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage DLL for Python wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python/hik_code_reader/_native | Out-Null
          Copy-Item -Force "build/hik_code_reader.dll" "python/hik_code_reader/_native/"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
        working-directory: python

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: gofmt (ffi/go)
        shell: bash
        run: |
          out=$(gofmt -l "ffi/go/hikcr")
          if [[ -n "$out" ]]; then echo "$out"; exit 1; fi

      - name: go mod tidy (ffi/go)
        working-directory: ffi/go
        run: go mod tidy

      # Go cgo 不支持 MSVC cl：编译 runtime/cgo 时会带 -Werror，cl 报 D8021。
      # 仍用 CMake+MSVC 编 hik_code_reader.dll；此处用 MinGW gcc 编 cgo 胶水并链接 .lib。
      - name: Install MinGW-w64 (cgo CC)
        run: choco install mingw -y --no-progress

      - name: Go build hikcr (cgo + gcc, link MSVC-built DLL)
        working-directory: ffi/go
        shell: pwsh
        run: |
          $bins = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          )
          $gccDir = $bins | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
          if (-not $gccDir) { throw "gcc.exe not found after choco install mingw; checked: $($bins -join ', ')" }
          $env:Path = "$gccDir;$env:Path"
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          $env:CGO_CFLAGS = "-I${{ github.workspace }}/include"
          $env:CGO_LDFLAGS = "-L${{ github.workspace }}/build -lhik_code_reader"
          go build -v ./...
