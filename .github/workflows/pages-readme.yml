# 默认分支上 README 变更时：只更新 GitHub Pages 根路径 index.html，保留发版生成的 simple/（PEP 503）
name: Pages (README)

on:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - ".github/scripts/generate_pages_site.py"
      - ".github/scripts/gen_pep503_simple.py"
      - ".github/scripts/pages_landing.py"
      - ".github/scripts/pep503_simple_index.py"
      - ".github/scripts/readme_render.py"
      - ".github/scripts/site_common.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-readme-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy-readme-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README → site/index.html
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PEP503_PROJECT: hik-code-reader
          PAGES_README_ONLY: "1"
          DOCS_REF: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "markdown>=3.5"
          python .github/scripts/generate_pages_site.py

      - name: Deploy to gh-pages (keep existing simple/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          force_orphan: false
