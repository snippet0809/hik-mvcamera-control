# 推送 v*.*.*：构建 wheel → GitHub Release；生成 PEP 503 索引 → gh-pages（供 pip）
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      wheel_name: ${{ steps.wheelmeta.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync python/pyproject.toml version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match '^v[0-9]')) { throw "Tag must be vX.Y.Z (e.g. v0.1.0)" }
          $ver = $tag.Substring(1)
          $py = "python/pyproject.toml"
          $c = Get-Content $py -Raw
          $c = $c -replace '(?m)^version = ".*"', "version = `"$ver`""
          Set-Content $py $c -NoNewline
          Write-Host "Set package version to $ver"

      - name: Setup CMake 4.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.2"

      - name: Install Ninja
        run: choco install ninja --yes

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja + MSVC：不依赖「Visual Studio 17 2022」生成器（windows-latest 可能未装 VS2022）
      - name: Configure & build native DLL
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage DLL for Python wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python/hik_code_reader/_native | Out-Null
          Copy-Item -Force "build/hik_code_reader.dll" "python/hik_code_reader/_native/"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
        working-directory: python

      - name: Zip ffi/go + C header (Go / cgo)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $zip = "hik-mvcamera-control-ffi-go-$ver.zip"
          Compress-Archive -Path "ffi/go", "include/hik_code_reader" -DestinationPath "python/dist/$zip"

      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item -Force "python/dist/*" "publish/"
          Copy-Item -Force "build/hik_code_reader.dll" "publish/"
          Copy-Item -Force "build/hik_code_reader.lib" "publish/"
          Get-ChildItem publish

      - id: wheelmeta
        shell: pwsh
        run: |
          $w = Get-ChildItem "python/dist/*.whl" | Select-Object -First 1 -ExpandProperty Name
          if (-not $w) { throw "No wheel produced" }
          "name=$w" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: publish/

  publish-release-pages:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Go submodule tag ffi/go/<same as release>
        run: |
          T="ffi/go/${{ github.ref_name }}"
          if git rev-parse "$T" >/dev/null 2>&1; then
            echo "Tag $T already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$T" "${{ github.sha }}"
            git push origin "refs/tags/$T"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifact-publish

      - name: GitHub Release（wheel / zip / dll / lib）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact-publish/*
          body: |
            ## Python（pip，不经 PyPI）

            **直链安装本 Release 的 wheel（推荐，不依赖 GitHub Pages）：**

            ```bash
            pip install "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ needs.build-windows.outputs.wheel_name }}"
            ```

            **通过 PEP 503 源安装**（需维护者已部署 `gh-pages` 索引；首次搭建见仓库 **README**「在 GitHub 上托管分发」，此处不重复管理员步骤）：

            将下面命令里的 `<版本>` 换成本 tag 去掉前缀 `v` 的版本号（本 tag：`${{ github.ref_name }}`）。

            ```bash
            pip install "hik-code-reader==<版本>" \
              --index-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/" \
              --trusted-host "${{ github.repository_owner }}.github.io"
            ```

            ## Go（模块在 `ffi/go`）

            ```bash
            go get "github.com/${{ github.repository }}/ffi/go@${{ github.ref_name }}"
            ```

            私有仓库：`GOPRIVATE=github.com/${{ github.repository_owner }}/*`

            模块路径：`github.com/${{ github.repository }}/ffi/go`。与本 tag 对应的 **`ffi/go/${{ github.ref_name }}`** 标签由工作流维护，供 `go get` 解析版本。

      - name: Fetch existing gh-pages simple index (merge links)
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          git show origin/gh-pages:simple/hik-code-reader/index.html > /tmp/prev-simple.html 2>/dev/null || true
          if [ -s /tmp/prev-simple.html ]; then echo "PREVIOUS_INDEX_HTML=/tmp/prev-simple.html" >> "$GITHUB_ENV"; fi

      - name: Generate PEP 503 site for GitHub Pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          WHEEL_FILENAME: ${{ needs.build-windows.outputs.wheel_name }}
          PEP503_PROJECT: hik-code-reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "markdown>=3.5"
          python .github/scripts/generate_pages_site.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false
          keep_files: true
