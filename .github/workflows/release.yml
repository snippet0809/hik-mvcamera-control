# 推送 v*.*.*：构建 wheel → GitHub Release；生成 PEP 503 索引 → gh-pages（供 pip）
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      wheel_name: ${{ steps.wheelmeta.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync python/pyproject.toml version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match '^v[0-9]')) { throw "Tag must be vX.Y.Z (e.g. v0.1.0)" }
          $ver = $tag.Substring(1)
          $py = "python/pyproject.toml"
          $c = Get-Content $py -Raw
          $c = $c -replace '(?m)^version = ".*"', "version = `"$ver`""
          Set-Content $py $c -NoNewline
          Write-Host "Set package version to $ver"

      - name: Setup CMake 4.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.2"

      - name: Install Ninja
        run: choco install ninja --yes

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja + MSVC：不依赖「Visual Studio 17 2022」生成器（windows-latest 可能未装 VS2022）
      - name: Configure & build native DLL
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage native artifacts for Python wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python/hik_code_reader/_native | Out-Null
          Copy-Item -Force "build/hik_code_reader.dll" "python/hik_code_reader/_native/"
          Copy-Item -Force "lib/MvCodeReader/win64/*.lib" "python/hik_code_reader/_native/"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
        working-directory: python

      # 校验 runtime/：哈希 + ABI 三重守卫（头声明符号集 == 二进制导出符号集）。
      # 放在打包之前——若 runtime/include 的头与 runtime 里的二进制对不上（「头新库旧」
      # 这类），宁可让发版失败，也不要发出一个会静默读错数据的包。
      - name: Verify runtime
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;" + (Split-Path (Get-Command objdump.exe -ErrorAction SilentlyContinue).Source -ErrorAction SilentlyContinue)
          bash scripts/verify-runtime.sh

      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item -Force "python/dist/*" "publish/"
          Copy-Item -Force "build/hik_code_reader.dll" "publish/"
          Copy-Item -Force "build/hik_code_reader.lib" "publish/"
          Copy-Item -Force "lib/MvCodeReader/win64/*.lib" "publish/"
          # 免安装分发用：整个裁剪过的运行时目录，使用方拷到 exe 旁边即可
          Compress-Archive -Path "runtime" -DestinationPath "publish/hik-mvcamera-control-runtime-${{ github.ref_name }}.zip" -Force
          Get-ChildItem publish

      - id: wheelmeta
        shell: pwsh
        run: |
          $w = Get-ChildItem "python/dist/*.whl" | Select-Object -First 1 -ExpandProperty Name
          if (-not $w) { throw "No wheel produced" }
          "name=$w" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: publish/

  # Linux 侧只构建 + 校验，不发布：libhik_*.so 需要维护者提交回 runtime/linux-x86_64/lib
  # 并重算 MANIFEST（这是唯一刻意保留的手动步骤，「头 + wrapper + 厂商运行时」原子三件套
  # 的纪律就落在这里）。本作业的价值是：每次发版都验证已提交的 runtime 仍自洽，
  # 并把新编的 .so 作为 artifact 供维护者取用。
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake 4.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.2"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Configure & build .so
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target hik_code_reader_shared hik_mvcamera_shared
          ls -l build/libhik_*.so

      # 断言链接期确实落地了 DT_RPATH=$ORIGIN：DT_RUNPATH 不被传递依赖继承，
      # 管不到 wrapper -> 厂商 .so 那一跳（踩过：读码器 dlopen 失败报 0x8002000B）。
      - name: Assert rpath and exports
        run: |
          set -e
          for f in build/libhik_code_reader.so build/libhik_mvcamera.so; do
            echo "--- $f"
            readelf -d "$f" | grep -E 'RPATH|RUNPATH'
            readelf -d "$f" | grep -qE 'RPATH.*\$ORIGIN' \
              || { echo "缺少 DT_RPATH=\$ORIGIN"; exit 1; }
            readelf -d "$f" | grep -q RUNPATH && { echo "出现了 RUNPATH，应为 RPATH"; exit 1; } || true
          done
          nm -D --defined-only build/libhik_code_reader.so | grep -q ' T hik_cr_enum_devices'
          nm -D --defined-only build/libhik_mvcamera.so    | grep -q ' T hik_cv_enum_devices'

      - name: Verify committed runtime (hash + ABI triples)
        run: bash scripts/verify-runtime.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-so
          path: build/libhik_*.so

  publish-release-pages:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 注：Go 模块根已抬到仓库根（见 go.mod），本 tag 即模块版本，
      # 不再需要单独维护 ffi/go/v* 标签。

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifact-publish

      - name: GitHub Release（wheel / zip / dll / lib）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact-publish/*
          body: |
            ## Python（pip，不经 PyPI）

            **直链安装本 Release 的 wheel（推荐，不依赖 GitHub Pages）：**

            ```bash
            pip install "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ needs.build-windows.outputs.wheel_name }}"
            ```

            **通过 PEP 503 源安装**（需维护者已部署 `gh-pages` 索引；首次搭建见仓库 **README**「在 GitHub 上托管分发」，此处不重复管理员步骤）：

            将下面命令里的 `<版本>` 换成本 tag 去掉前缀 `v` 的版本号（本 tag：`${{ github.ref_name }}`）。

            ```bash
            pip install "hik-code-reader==<版本>" \
              --index-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/" \
              --trusted-host "${{ github.repository_owner }}.github.io"
            ```

            ## Go（模块根即仓库根）

            ```bash
            go get "github.com/${{ github.repository }}@${{ github.ref_name }}"
            ```

            ```go
            import (
                "github.com/${{ github.repository }}/hikcr" // 读码器
                "github.com/${{ github.repository }}/hikcv" // 相机
            )
            ```

            私有仓库：`GOPRIVATE=github.com/${{ github.repository_owner }}/*`

            模块路径为 `github.com/${{ github.repository }}`（`go.mod` 在仓库根），
            所以**本 tag 就是模块版本**，不需要单独的 `ffi/go/v*` 标签。

            ## 免安装运行时

            附件中的 **`hik-mvcamera-control-runtime-${{ github.ref_name }}.zip`** 是裁剪过的
            海康运行时（Windows x64 + Linux x86_64）。**使用方无需安装 MVS / IDMVS**：
            解压后把对应平台目录里的库拷到可执行文件旁边即可。来源与校验见包内
            `runtime/VERSION` 与 `runtime/MANIFEST.sha256`。

      - name: Fetch existing gh-pages simple index (merge links)
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          git show origin/gh-pages:simple/hik-code-reader/index.html > /tmp/prev-simple.html 2>/dev/null || true
          if [ -s /tmp/prev-simple.html ]; then echo "PREVIOUS_INDEX_HTML=/tmp/prev-simple.html" >> "$GITHUB_ENV"; fi

      - name: Generate PEP 503 site for GitHub Pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          WHEEL_FILENAME: ${{ needs.build-windows.outputs.wheel_name }}
          PEP503_PROJECT: hik-code-reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "markdown>=3.5"
          python .github/scripts/generate_pages_site.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false
          keep_files: true
